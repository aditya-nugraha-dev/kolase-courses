name: Deploy kolase-static to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "kolase-static/**"
      - ".github/workflows/deploy-static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject Supabase cloud config (optional)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'window.KOLASE_SUPABASE_URL = "%s";\nwindow.KOLASE_SUPABASE_ANON_KEY = "%s";\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > kolase-static/js/supabase-config.js
            echo "Cloud config injected."
          else
            echo "SUPABASE_* secrets empty — offline mode, localStorage only."
          fi
      - name: Inject Sheets endpoint (optional)
        env:
          SHEETS_ENDPOINT: ${{ secrets.SHEETS_ENDPOINT }}
          SHEETS_API_KEY: ${{ secrets.SHEETS_API_KEY }}
        run: |
          if [ -n "$SHEETS_ENDPOINT" ]; then
            {
              printf 'window.KOLASE_SHEETS_ENDPOINT = "%s";\n' "$SHEETS_ENDPOINT"
              printf 'window.KOLASE_SHEETS_KEY = "%s";\n' "$SHEETS_API_KEY"
              printf 'window.KOLASE_DEV = false;\n'
            } > kolase-static/js/sheets-config.js
            echo "Sheets endpoint injected."
          else
            echo "SHEETS_ENDPOINT secret empty — Sheets sync offline (local queue only)."
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload kolase-static
        uses: actions/upload-pages-artifact@v3
        with:
          path: kolase-static
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy kolase-static to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "kolase-static/**"
      - ".github/workflows/deploy-static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload kolase-static
        uses: actions/upload-pages-artifact@v3
        with:
          path: kolase-static
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

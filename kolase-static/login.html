<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOLASE — Masuk / Daftar</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/kolase-logo.png">
</head>
<body>
<header class="topbar"><div class="wrap">
  <a class="brand" href="home.html"><img src="assets/kolase-logo.png" alt="KOLASE"><span class="logo-name">KOLASE<small>ENGLISH COURSE</small></span></a>
  <nav class="nav" data-nav><a href="home.html">Home</a><a href="catalog.html">Katalog</a><a href="dashboard.html">Dashboard</a><a href="schedule.html">Kalender</a><a href="teacher-chat.html">Chat</a><a href="profile.html">Profil</a><a href="login.html">Masuk</a></nav>
  <button class="burger" data-burger>☰</button>
</div></header>
<main class="wrap">
  <div class="section"><div class="card form-card">
    <h2>Registrasi & Login</h2>
    <p class="small">Pilih peran → ID permanen otomatis: <span class="id-mono">STU-XXXXXX</span> / <span class="id-mono">TCH-XXXXXX</span> (seumur hidup)</p>
    <div class="field"><label>Peran</label><select id="role"><option value="student">Student</option><option value="teacher">Teacher</option></select></div>
    <div class="field"><label>Nama</label><input id="nama" placeholder="Nama lengkap"></div>
    <div class="field"><label>Email</label><input id="email" placeholder="nama@email.id"></div>
    <div class="field"><label>No. WA</label><input id="wa" placeholder="08xx"></div>
    <button class="btn btn-brand" id="regBtn" style="width:100%">Buat ID & Masuk</button>
    <div id="out" style="margin-top:10px"></div>
  </div></div>
</main>
<script src="js/store.js"></script><script src="js/app.js"></script>
<script>
// Sudah masuk? Langsung ke portal, tanpa form login lagi.
try {
  const u = (KolaseStore.loadDB().sessionUser) || null;
  if (u) location.replace(KolaseStore.portalFor(u.role));
} catch (e) {}
document.getElementById("regBtn").onclick = () => {
  const role = document.getElementById("role").value;
  const nama = document.getElementById("nama").value || "Pengguna Baru";
  const email = document.getElementById("email").value || "";
  const wa = document.getElementById("wa").value || "";
  if (!email || !wa) {
    document.getElementById("out").textContent = "Email dan No. WA wajib diisi.";
    return;
  }
  const id = KolaseStore.registerPerson(role, nama, email, wa);
  const dest = role==="student" ? "catalog.html" : "teacher-portal.html";
  document.getElementById("out").innerHTML = `ID kamu: <span class="id-mono">${id}</span> • <a href="${dest}">Lanjut →</a>`;
};
</script>
</body>
</html>

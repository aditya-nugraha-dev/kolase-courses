<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOLASE — Kalender Siswa</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/kolase-logo.png">
</head>
<body data-guard="student,teacher">
<header class="topbar"><div class="wrap">
  <a class="brand" href="home.html"><img src="assets/kolase-logo.png" alt="KOLASE"><span class="logo-name">KOLASE<small>ENGLISH COURSE</small></span></a>
  <nav class="nav" data-nav><a href="home.html">Home</a><a href="catalog.html">Katalog</a><a href="dashboard.html">Dashboard</a><a href="schedule.html">Kalender</a><a href="teacher-chat.html">Chat</a><a href="profile.html">Profil</a><a href="login.html">Masuk</a></nav>
  <button class="burger" data-burger>☰</button>
</div></header>
<main class="wrap">
  <div class="section"><h2>Student Calendar</h2><p class="small">Agenda 4 minggu • sinkron Google Calendar (source of truth = database/Sheets).</p>
  <div class="cal-list" id="cal"></div></div>
</main>
<nav class="mobile-tabs"><a href="dashboard.html">Materi</a><a href="teacher-chat.html">Chat</a><a href="schedule.html" class="active">Jadwal</a><a href="profile.html">Profil</a></nav>
<script src="js/store.js"></script><script src="js/app.js"></script>
<script>
const db = KolaseStore.loadDB();
const list = db.SESSIONS.filter(s=>!db.sessionUser || db.CLASS_MEMBERSHIP.some(m=>m.enrollment_id===s.enrollment_id && m.student_id===db.sessionUser.id));
const totByEnr = {}; db.SESSIONS.forEach(s=>{ totByEnr[s.enrollment_id]=(totByEnr[s.enrollment_id]||0)+1; });
document.getElementById("cal").innerHTML = list.length ? list.map(s=>{
  const [y,m,d]=s.tanggal.split("-");
  // Link "Tambah ke Google Calendar" real (tanpa OAuth): membuka template event 10:00-11:00 WIB (=03:00-04:00 UTC)
  const dt = s.tanggal.replace(/-/g, "");
  const gcal = "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + "&text=" + encodeURIComponent(`KOLASE ${s.enrollment_id} — Sesi ${s.seq}/${totByEnr[s.enrollment_id]||s.seq}`)
    + `&dates=${dt}T030000Z/${dt}T040000Z`
    + "&details=" + encodeURIComponent(`Google Meet • ${s.session_id} • source of truth: database/Sheets`);
  return `<div class="cal-item"><div class="date-box"><b>${d}</b><span class="small">${m}/${y.slice(2)}</span></div>
  <div style="flex:1"><b>${s.enrollment_id} — Sesi ${s.seq}/${totByEnr[s.enrollment_id]||s.seq}</b><div class="small">${s.tanggal} • 10:00 WIB • Google Meet • ${s.hadir||s.status}</div>
  <a class="small" style="color:var(--gold)" href="${gcal}" target="_blank" rel="noopener">+ Tambah ke Google Calendar</a></div>
  <span class="pill ${s.hadir==="PRESENT"||s.hadir==="LATE"?"p-present":s.hadir==="ABSENT"?"p-absent":"p-pending"}">${s.hadir||"SCHEDULED"}</span></div>`;
}).join("") : `<div class="card">Belum ada jadwal. <a href="catalog.html">Ambil kelas →</a></div>`;
</script>
</body>
</html>

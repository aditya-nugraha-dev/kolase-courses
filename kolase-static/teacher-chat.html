<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOLASE — Teacher Chat</title>
<link rel="stylesheet" href="css/style.css?v=6">
<link rel="icon" href="assets/kolase-logo.png">
</head>
<body data-guard="student,teacher,staff,admin,founder,academic,systems,author,owner">
<header class="topbar"><div class="wrap">
  <a class="brand" href="home.html"><img src="assets/kolase-logo.png" alt="KOLASE"><span class="logo-name">KOLASE<small>ENGLISH COURSE</small></span></a>
  <nav class="nav" data-nav><a href="home.html">Home</a><a href="catalog.html">Katalog</a><a href="dashboard.html">Dashboard</a><a href="schedule.html">Kalender</a><a href="teacher-chat.html">Chat</a><a href="profile.html">Profil</a><a href="login.html" data-guest-only>Masuk</a></nav>
  <button class="burger" data-burger>☰</button>
</div></header>
<main class="wrap">
  <div class="section"><h2 id="chatTitle">Teacher Chat</h2><p class="small" id="lock"></p>
    <div id="studentView">
      <div class="chat-box" id="box"></div>
      <div class="chat-input"><input id="inp" placeholder="Tulis pesan..." style="flex:1;padding:12px;border:1px solid #e5e7eb;border-radius:10px"><button class="btn btn-brand" id="send">Kirim</button></div>
    </div>
    <div id="staffView" style="display:none">
      <div class="layout-2">
        <div><b class="small">Chat masuk dari murid</b><div id="threadList" style="margin-top:8px"></div></div>
        <div>
          <div class="card" id="convCard" style="display:none">
            <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
              <button class="btn btn-ghost btn-sm" id="backBtn" style="display:none">←</button>
              <div><b id="convName">—</b><div class="small" id="convId"></div></div>
            </div>
            <div class="chat-box" id="box2" style="min-height:260px"></div>
            <div class="chat-input"><input id="inp2" placeholder="Balas murid..." style="flex:1;padding:12px;border:1px solid #e5e7eb;border-radius:10px"><button class="btn btn-brand" id="send2">Kirim</button></div>
          </div>
          <div class="card small" id="convEmpty">Pilih chat murid di sebelah kiri untuk membalas.</div>
        </div>
      </div>
    </div>
  </div>
</main>
<nav class="mobile-tabs"><a href="dashboard.html">Materi</a><a href="teacher-chat.html" class="active">Chat</a><a href="schedule.html">Jadwal</a><a href="profile.html">Profil</a></nav>
<script src="js/store.js?v=8"></script><script src="js/i18n.js?v=2"></script><script src="js/app.js?v=8"></script>
<script>
var db = KolaseStore.loadDB();
var me = db.sessionUser;
var STAFF = ["staff","admin","owner","author","founder","academic","systems"];
var isTeacher = me && (me.role === "teacher" || STAFF.indexOf(me.role) !== -1);
var activeSid = null;
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]); }); }
if (isTeacher) {
  document.getElementById("chatTitle").textContent = "Chat Masuk dari Murid";
  document.getElementById("lock").textContent = "Setiap teacher memegang chat dari murid — pilih thread untuk membalas.";
  document.getElementById("studentView").style.display = "none";
  document.getElementById("staffView").style.display = "";
  if (window.innerWidth < 860) document.getElementById("backBtn").style.display = "";
  renderThreads();
  setInterval(function(){ if (!document.hidden) { renderThreads(true); renderConv(true); } }, 4000);
} else {
  var verified = db.CLASS_MEMBERSHIP.some(m=>me && m.student_id===me.id && m.status==="ACTIVE");
  document.getElementById("lock").textContent = verified ? "Terbuka — pembayaran VERIFIED." : "Terkunci (demo tetap bisa lihat). Selesaikan pembayaran agar VERIFIED di production.";
  renderMine();
  setInterval(function(){ if (!document.hidden) renderMine(); }, 4000);
}
function renderMine(){
  var t = me ? KolaseStore.chatThread(me.id) : null;
  var msgs = t ? t.messages : [];
  try {
    var n = msgs.filter(function(m){ return m.from !== "student"; }).length;
    localStorage.setItem("kolase_chat_seen_" + me.id, String(n));
  } catch(e){}
  document.getElementById("box").innerHTML = msgs.length
    ? msgs.map(m=>`<div class="msg ${m.from==="student"?"me":"them"}">${esc(m.text)}<div class="small">${esc(m.at||"")}</div></div>`).join("")
    : `<div class="small" style="text-align:center;padding:12px">Belum ada pesan. Sapa teachermu — contoh: “Halo, kapan sesi berikutnya?”</div>`;
  document.getElementById("box").scrollTop = 9999;
}
function renderThreads(silent){
  try {
    var list = KolaseStore.listChatThreads();
    var el = document.getElementById("threadList");
    el.innerHTML = list.length ? list.map(function(t){
      var last = t.messages[t.messages.length-1];
      return `<button class="btn btn-ghost btn-sm" style="display:block;width:100%;text-align:left;margin-bottom:6px;${activeSid===t.student_id?"border-color:var(--navy);background:#fff":""}" data-thread="${esc(t.student_id)}"><b>${esc(t.nama||t.student_id)}</b><br><span class="small">${esc(t.student_id)} • ${t.messages.length} pesan${last ? " • " + esc(String(last.text).slice(0,40)) : ""}</span></button>`;
    }).join("") : `<div class="card small">Belum ada chat masuk dari murid.</div>`;
    el.querySelectorAll("[data-thread]").forEach(function(b){
      b.onclick = function(){ activeSid = b.getAttribute("data-thread"); renderThreads(); renderConv(); };
    });
  } catch(e){ if(!silent) alert(e.message); }
}
function renderConv(silent){
  if (!activeSid) return;
  try {
    var t = KolaseStore.chatThread(activeSid);
    var msgs = t ? t.messages : [];
    document.getElementById("convCard").style.display = "";
    document.getElementById("convEmpty").style.display = "none";
    document.getElementById("convName").textContent = (t && t.nama) || activeSid;
    document.getElementById("convId").textContent = activeSid;
    document.getElementById("box2").innerHTML = msgs.length
      ? msgs.map(m=>`<div class="msg ${m.from==="student"?"them":"me"}">${esc(m.text)}<div class="small">${esc(m.at||"")}</div></div>`).join("")
      : `<div class="small" style="text-align:center;padding:12px">Belum ada pesan di thread ini.</div>`;
    document.getElementById("box2").scrollTop = 9999;
  } catch(e){ if(!silent) alert(e.message); }
}
document.getElementById("backBtn").onclick = function(){ activeSid = null; document.getElementById("convCard").style.display = "none"; document.getElementById("convEmpty").style.display = ""; renderThreads(); };
document.getElementById("send").onclick = () => {
  var v = document.getElementById("inp").value.trim(); if(!v) return;
  try {
    KolaseStore.sendChat(v);
    document.getElementById("inp").value=""; renderMine();
    setTimeout(()=>{
      try {
        var d = KolaseStore.loadDB();
        var u = d.sessionUser;
        if (u && u.role === "student") {
          var t = d.CHAT_THREADS[u.id];
          if (t && t.messages.filter(m=>m.from!=="student").length === 0) {
            t.messages.push({from:"teacher", text:"Siap, dicatat ya. Sampai jumpa di sesi berikutnya! (balasan otomatis demo)", at:new Date().toTimeString().slice(0,5)});
            t.updated_at = new Date().toISOString();
            KolaseStore.saveDB(d);
            renderMine();
          }
        }
      } catch(e){}
    },800);
  } catch(e){ alert(e.message); }
};
document.getElementById("send2").onclick = () => {
  var v = document.getElementById("inp2").value.trim(); if(!v || !activeSid) return;
  try {
    var staffSide = me && STAFF.indexOf(me.role) !== -1;
    KolaseStore.teacherSendChat(activeSid, v, staffSide);
    document.getElementById("inp2").value=""; renderConv(); renderThreads(true);
  } catch(e){ alert(e.message); }
};
</script>
</body>
</html>

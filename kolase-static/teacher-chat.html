<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOLASE — Teacher Chat</title>
<link rel="stylesheet" href="css/style.css?v=4">
<link rel="icon" href="assets/kolase-logo.png">
</head>
<body data-guard="student,teacher">
<header class="topbar"><div class="wrap">
  <a class="brand" href="home.html"><img src="assets/kolase-logo.png" alt="KOLASE"><span class="logo-name">KOLASE<small>ENGLISH COURSE</small></span></a>
  <nav class="nav" data-nav><a href="home.html">Home</a><a href="catalog.html">Katalog</a><a href="dashboard.html">Dashboard</a><a href="schedule.html">Kalender</a><a href="teacher-chat.html">Chat</a><a href="profile.html">Profil</a><a href="login.html" data-guest-only>Masuk</a></nav>
  <button class="burger" data-burger>☰</button>
</div></header>
<main class="wrap">
  <div class="section"><h2>Teacher Chat</h2><p class="small" id="lock"></p>
    <div class="chat-box" id="box"></div>
    <div class="chat-input"><input id="inp" placeholder="Tulis pesan..." style="flex:1;padding:12px;border:1px solid #e5e7eb;border-radius:10px"><button class="btn btn-brand" id="send">Kirim</button></div>
  </div>
</main>
<nav class="mobile-tabs"><a href="dashboard.html">Materi</a><a href="teacher-chat.html" class="active">Chat</a><a href="schedule.html">Jadwal</a><a href="profile.html">Profil</a></nav>
<script src="js/store.js?v=4"></script><script src="js/app.js?v=4"></script>
<script>
const db = KolaseStore.loadDB();
const verified = db.CLASS_MEMBERSHIP.some(m=>db.sessionUser && m.student_id===db.sessionUser.id && m.status==="ACTIVE");
document.getElementById("lock").textContent = verified ? "Terbuka — pembayaran VERIFIED." : "Terkunci (demo tetap bisa lihat). Selesaikan pembayaran agar VERIFIED di production.";
function render(){
  const d = KolaseStore.loadDB();
  document.getElementById("box").innerHTML = d.CHAT.map(m=>`<div class="msg ${m.from==="me"?"me":"them"}">${m.text}<div class="small">${m.at}</div></div>`).join("");
  document.getElementById("box").scrollTop = 9999;
}
render();
document.getElementById("send").onclick = () => {
  const v = document.getElementById("inp").value.trim(); if(!v) return;
  const d = KolaseStore.loadDB(); d.CHAT.push({from:"me",text:v,at:new Date().toTimeString().slice(0,5)}); KolaseStore.saveDB(d);
  document.getElementById("inp").value=""; render();
  setTimeout(()=>{ const d2=KolaseStore.loadDB(); d2.CHAT.push({from:"them",text:"Siap, dicatat ya. Sampai jumpa di sesi berikutnya!",at:new Date().toTimeString().slice(0,5)}); KolaseStore.saveDB(d2); render(); },800);
};
</script>
</body>
</html>

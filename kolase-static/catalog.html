<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOLASE — Katalog Kelas</title>
<link rel="stylesheet" href="css/style.css?v=6">
<link rel="icon" href="assets/kolase-logo.png">
</head>
<body>
<header class="topbar"><div class="wrap">
  <a class="brand" href="home.html"><img src="assets/kolase-logo.png" alt="KOLASE"><span class="logo-name">KOLASE<small>ENGLISH COURSE</small></span></a>
  <nav class="nav" data-nav>
    <a href="home.html">Home</a><a href="catalog.html">Katalog</a>
    <a href="dashboard.html">Dashboard</a><a href="schedule.html">Kalender</a>
    <a href="teacher-chat.html">Chat</a><a href="profile.html">Profil</a><a href="login.html" data-guest-only>Masuk</a>
  </nav>
  <button class="burger" data-burger>☰</button>
</div></header>
<main class="wrap">
  <div class="section"><h2 data-i18n="cat.title">Katalog Kelas</h2>
    <p class="small" data-i18n="cat.desc">Desktop: filter sidebar • Mobile: filter bottom-sheet.</p>
    <button class="btn btn-ghost btn-sm mobile-only" data-open-sheet>Filter (Mobile)</button>
  </div>
  <div class="layout-2">
    <aside class="card sidebar">
      <b data-i18n="cat.filter">Filter</b>
      <div class="field"><label data-i18n="cat.level">Level</label><select id="fLevel"><option value="" data-i18n="cat.all">Semua</option><option>KIDS</option><option>TEEN</option></select></div>
      <div class="field"><label data-i18n="cat.maxprice">Harga maks</label><select id="fPrice"><option value="" data-i18n="cat.all">Semua</option><option value="700000">≤ Rp 700rb</option><option value="1000000">≤ Rp 1jt</option></select></div>
      <button class="btn btn-brand btn-sm" id="fApply" data-i18n="cat.apply">Terapkan</button>
    </aside>
    <div><div class="grid cols-3" data-catalog></div></div>
  </div>
</main>
<div class="scrim" data-scrim data-close-sheet></div>
<div class="sheet" data-sheet>
  <b data-i18n="cat.filterm">Filter Kelas</b>
  <div class="field"><label data-i18n="cat.level">Level</label><select id="mLevel"><option value="" data-i18n="cat.all">Semua</option><option>KIDS</option><option>TEEN</option></select></div>
  <button class="btn btn-brand" data-close-sheet id="mApply" data-i18n="cat.show">Tampilkan</button>
</div>
<nav class="mobile-tabs"><a href="home.html">Home</a><a href="catalog.html" class="active">Katalog</a><a href="dashboard.html">Kelas</a><a href="teacher-chat.html">Chat</a><a href="profile.html">Profil</a></nav>
<footer><div class="wrap"><a href="home.html">← Home</a></div></footer>
<script src="js/store.js?v=9"></script><script src="js/i18n.js?v=3"></script><script src="js/app.js?v=9"></script>
<script>
document.getElementById("fApply").onclick = () => {
  const lv = document.getElementById("fLevel").value;
  location.search = lv ? "?level=" + lv : "";
};
document.getElementById("mApply").onclick = () => {
  const lv = document.getElementById("mLevel").value;
  location.search = lv ? "?level=" + lv : "";
};
</script>
</body>
</html>

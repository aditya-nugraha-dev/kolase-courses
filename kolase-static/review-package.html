<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOLASE — Tulis Ulasan Paket</title>
<link rel="stylesheet" href="css/style.css?v=10">
<link rel="icon" href="assets/kolase-logo.png">
</head>
<body data-guard="student">
<header class="topbar"><div class="wrap">
  <a class="brand" href="home.html"><img src="assets/kolase-wordmark-black.png" alt="KOLASE English Academy"></a>
  <nav class="nav" data-nav><a href="home.html">Home</a><a href="catalog.html">Katalog</a><a href="dashboard.html">Dashboard</a><a href="teacher-portal.html">Teacher</a><a href="staff-portal.html">Staff</a><a href="teacher-chat.html">Chat</a><a href="profile.html">Profil</a></nav>
  <button class="burger" data-burger>☰</button>
</div></header>
<main class="wrap">
  <div class="section"><div class="card form-card" id="box">Memuat...</div></div>
</main>
<nav class="mobile-tabs"><a href="dashboard.html">Materi</a><a href="teacher-chat.html">Chat</a><a href="schedule.html">Jadwal</a><a href="profile.html">Profil</a></nav>
<script src="js/store.js?v=14"></script><script src="js/i18n.js?v=11"></script><script src="js/nav.js?v=4"></script><script src="js/app.js?v=18"></script>
<script>
const db = KolaseStore.loadDB();
const uid = db.sessionUser && db.sessionUser.id;
const box = document.getElementById("box");
const pkgs = uid ? KolaseStore.eligiblePackages(uid) : [];
const starRow = (key, label) => `
  <div class="field"><label>Penilaian ${label} ★</label><div class="stars">
    ${[5,4,3,2,1].map(n=>`<input type="radio" name="${key}" id="${key}${n}" value="${n}" ${n===5?"checked":""}><label for="${key}${n}">★</label>`).join("")}
  </div></div>`;
if (pkgs.length) {
  const prog = (enr) => KolaseStore.packageProgress(enr);
  box.innerHTML = `<h2>Tulis Ulasan Paket</h2>
  <p class="small">Selamat! Kamu menyelesaikan 1 paket. Ulasanmu tampil di homepage.</p>
  <div class="field"><label>Paket selesai</label><select id="enrSel">${pkgs.map(m=>{ const p = prog(m.enrollment_id); return `<option value="${m.enrollment_id}">${m.enrollment_id} • ${m.class_id} • ${p.doneCount}/${p.total} sesi</option>`; }).join("")}</select></div>
  ${starRow("rating_kelas","Kelas")}
  ${starRow("rating_guru","Guru")}
  ${starRow("rating_pembelajaran","Pembelajaran")}
  ${starRow("rating_materi","Materi")}
  <div class="field"><label>Ulasan</label><textarea id="teks" rows="4" placeholder="Ceritakan pengalaman 1 paket-mu..."></textarea></div>
  <button class="btn btn-brand" id="sendBtn" style="width:100%">Kirim Ulasan</button><div id="msg" class="small" style="margin-top:8px"></div>`;
  document.getElementById("sendBtn").onclick = () => {
    const ratings = {};
    ["rating_kelas","rating_guru","rating_pembelajaran","rating_materi"].forEach(k => {
      ratings[k] = (document.querySelector(`input[name="${k}"]:checked`)||{}).value || 5;
    });
    try {
      KolaseStore.submitPackageReview(document.getElementById("enrSel").value, ratings, document.getElementById("teks").value);
      document.getElementById("msg").innerHTML = `Terima kasih! Ulasanmu sudah tampil di <a href="home.html">homepage →</a>`;
    } catch(e){ document.getElementById("msg").textContent = e.message; }
  };
} else {
  const myEnr = uid ? db.CLASS_MEMBERSHIP.filter(m=>m.student_id===uid) : [];
  const prog = myEnr.map(m => ({ m, p: KolaseStore.packageProgress(m.enrollment_id) })).find(x => !x.p.complete && x.p.total > 0);
  if (prog) {
    box.innerHTML = `<h2>Belum Bisa Mengulas</h2>
    <p>Selesaikan dulu 1 paket untuk membuka ulasan berbintang.</p>
    <div class="small">Progres <span class="id-mono">${prog.m.enrollment_id}</span>: <b>${prog.p.doneCount}/${prog.p.total} sesi</b></div>
    <div class="progress" style="margin:10px 0"><i style="width:${prog.p.doneCount/prog.p.total*100}%"></i></div>
    <p class="small"><a href="dashboard.html">Lihat progres paket →</a></p>`;
  } else if (myEnr.length) {
    box.innerHTML = `<h2>Terima Kasih</h2><p class="small">Semua paketmu sudah diulas. Ambil paket baru untuk melanjutkan belajar.</p><a class="btn btn-brand" href="catalog.html">Lihat Katalog →</a>`;
  } else {
    box.innerHTML = `<h2>Belum Ada Paket</h2>
    <p class="small">Ambil paket dulu. Ulasan terbuka otomatis setelah semua sesi selesai.</p>
    <a class="btn btn-brand" href="catalog.html">Pilih Kelas →</a>`;
  }
}
</script>
</body>
</html>
